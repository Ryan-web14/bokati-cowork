<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/page :: pagehead('Lien expiré · Elle A Osé')}"></head>
<body>
<main class="page">
  <div th:replace="~{fragments/page :: brand}"></div>
  <div th:replace="~{fragments/page :: brand-rule}"></div>

  <p class="state ko">Lien expiré</p>
  <h1>Ce lien ne fonctionne plus</h1>
  <!-- Jamais « Erreur » · le titre dit ce qui s'est passe, la phrase dit comment s'en sortir. -->
  <p class="lede" th:text="${reason} ?: 'Il a dépassé trente minutes, ou il a déjà servi. Demandez-en un nouveau depuis la page de connexion.'">Motif</p>

  <div th:replace="~{fragments/page :: foot('Elle A Osé · Pointe-Noire')}"></div>
</main>
</body>
</html>
