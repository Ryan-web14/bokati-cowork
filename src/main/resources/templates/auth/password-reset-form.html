<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/page :: pagehead('Nouveau mot de passe · Elle A Osé')}"></head>
<body>
<main class="page">
  <div th:replace="~{fragments/page :: brand}"></div>
  <div th:replace="~{fragments/page :: brand-rule}"></div>

  <p class="state todo">Action requise</p>
  <h1>Nouveau mot de passe</h1>
  <p class="lede">Choisissez un mot de passe d'au moins six caractères, avec au moins une lettre et un chiffre.</p>

  <!-- L'echec dit ce qui s'est passe et reste au-dessus du champ concerne · relegue en bas,
       il se lit apres avoir resaisi. -->
  <p class="notice" th:if="${error}" style="border-left-color:#A32A34; color:#A32A34; margin-top:0; margin-bottom:16px"
     th:text="${error}">Message</p>

  <form th:action="@{/sni/api/v1/auth/password-reset/form}" method="post">
    <input type="hidden" name="token" th:value="${token}">
    <input type="hidden" name="_csrf" th:value="${_csrf}">

    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">Confirmation</label>
      <input type="password" id="confirm" name="confirmPassword" required minlength="6" autocomplete="new-password">
    </div>

    <button type="submit" class="btn">Enregistrer</button>
  </form>

  <p class="notice">Ce lien expire trente minutes après son envoi.</p>
  <div th:replace="~{fragments/page :: foot('Elle A Osé · Pointe-Noire')}"></div>
</main>
</body>
</html>
