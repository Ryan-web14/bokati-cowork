<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex, nofollow"/>



<title>Réinitialisation du mot de passe</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #F4F3F7; color: #1A0A2E;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
    }
    .panel {
        width: 100%; max-width: 400px; background: #fff;
        border: 1px solid #ECE9F2; border-radius: 16px; padding: 40px 36px;
        box-shadow: 0 4px 24px rgba(26,10,46,.05);
    }
    .brand { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #9A8FAC; margin-bottom: 26px; }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #7A7088; line-height: 1.6; margin-bottom: 28px; }

    .alert { font-size: 13px; color: #9B3D3D; background: #FCF2F2; border: 1px solid #F1D9D9; border-radius: 10px; padding: 11px 14px; margin-bottom: 20px; line-height: 1.5; }

    .field { margin-bottom: 18px; }
    .field-label { display: block; font-size: 13px; font-weight: 600; color: #4A4058; margin-bottom: 8px; }
    .field-wrap { position: relative; }
    .field-input {
        width: 100%; border: 1px solid #E2DCEC; border-radius: 10px;
        padding: 13px 46px 13px 15px; font-size: 15px; color: #1A0A2E; background: #fff;
        outline: none; transition: border-color .15s, box-shadow .15s; font-family: inherit;
    }
    .field-input::placeholder { color: #B4ABC2; }
    .field-input:focus { border-color: #6D4AAE; box-shadow: 0 0 0 3px rgba(109,74,174,.12); }
    .eye-btn {
        position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
        background: none; border: none; cursor: pointer; padding: 6px; color: #A99BC0;
        display: flex; align-items: center; border-radius: 8px;
    }
    .eye-btn:hover { color: #1A0A2E; }
    .eye-btn:focus-visible { outline: 2px solid #6D4AAE; outline-offset: 2px; }

    .hint { font-size: 12.5px; color: #8A7F98; line-height: 1.6; margin: 2px 0 24px; }

    .btn {
        display: block; width: 100%; padding: 14px; background: #1A0A2E; color: #fff;
        font-size: 14px; font-weight: 600; letter-spacing: .3px; text-align: center; text-decoration: none;
        border: none; border-radius: 10px; cursor: pointer; font-family: inherit; transition: background .15s;
    }
    .btn:hover { background: #2C1650; }
    .btn:disabled { opacity: .65; cursor: default; }

    .foot { margin-top: 26px; padding-top: 20px; border-top: 1px solid #F0ECF5; font-size: 12.5px; color: #9A8FAC; line-height: 1.6; text-align: center; }

    @media (max-width: 420px) { .panel { padding: 32px 22px; border-radius: 14px; } }
</style>
</head>
<body>

<main class="panel">
    <div class="brand">Elle A Osé</div>
    <h1 class="title">Nouveau mot de passe</h1>
    <p class="subtitle">Choisissez un mot de passe pour sécuriser votre compte.</p>

    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/sni/api/v1/auth/password-reset/form}" autocomplete="off" novalidate>
        <input type="hidden" name="token" th:value="${token}"/>
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>

        <div class="field">
            <label class="field-label" for="newPassword">Nouveau mot de passe</label>
            <div class="field-wrap">
                <input class="field-input" type="password" id="newPassword" name="newPassword"
                       required minlength="8" placeholder="Minimum 8 caractères"
                       autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"/>
                <button type="button" class="eye-btn" data-toggle="newPassword" aria-label="Afficher ou masquer le mot de passe">
                    <svg id="eye-new-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="eye-new-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="field">
            <label class="field-label" for="confirmPassword">Confirmer le mot de passe</label>
            <div class="field-wrap">
                <input class="field-input" type="password" id="confirmPassword" name="confirmPassword"
                       required minlength="8" placeholder="Répétez le mot de passe"
                       autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"/>
                <button type="button" class="eye-btn" data-toggle="confirmPassword" aria-label="Afficher ou masquer le mot de passe">
                    <svg id="eye-confirm-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="eye-confirm-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>
        </div>

        <p class="hint">Au moins 8 caractères, avec des lettres et des chiffres.</p>

        <button type="submit" class="btn">Réinitialiser le mot de passe</button>
    </form>

    <div class="foot">Si vous n'êtes pas à l'origine de cette demande, fermez cette page. Votre mot de passe reste inchangé.</div>
</main>

<script th:attr="nonce=${nonce}">
function togglePwd(fieldId) {
    var input = document.getElementById(fieldId);
    var isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    var prefix = fieldId === 'newPassword' ? 'eye-new' : 'eye-confirm';
    document.getElementById(prefix + '-show').style.display = isPassword ? 'none' : '';
    document.getElementById(prefix + '-hide').style.display = isPassword ? '' : 'none';
}

// Wire the show/hide toggles without inline handlers (Content-Security-Policy compliant).
document.querySelectorAll('.eye-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { togglePwd(btn.getAttribute('data-toggle')); });
});

// Progressive enhancement: confirm match and guard against double submission.
(function () {
    var form = document.querySelector('form');
    if (!form) return;
    var pwd = document.getElementById('newPassword');
    var confirm = document.getElementById('confirmPassword');
    var submit = form.querySelector('.btn');

    function checkMatch() {
        if (confirm.value && pwd.value !== confirm.value) {
            confirm.setCustomValidity('Les deux mots de passe ne correspondent pas.');
        } else {
            confirm.setCustomValidity('');
        }
    }
    pwd.addEventListener('input', checkMatch);
    confirm.addEventListener('input', checkMatch);

    form.addEventListener('submit', function (e) {
        checkMatch();
        if (!form.checkValidity()) {
            e.preventDefault();
            form.reportValidity();
            return;
        }
        submit.disabled = true;
        submit.textContent = 'Réinitialisation…';
    });
})();
</script>
</body>
</html>
