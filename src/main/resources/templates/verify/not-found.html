<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/page :: pagehead('Référence introuvable · Elle A Osé')}"></head>
<body>
<main class="page">
  <div th:replace="~{fragments/page :: brand}"></div>
  <div th:replace="~{fragments/page :: brand-rule}"></div>

  <p class="state ko">Introuvable</p>
  <h1>Cette référence n'existe pas</h1>
  <p class="lede">Aucun document ne porte cette référence. Vérifiez la saisie, ou reprenez le lien depuis le document lui-même.</p>

  <dl class="rows">
    <div><dt>Type recherché</dt><dd th:text="${type}">Type</dd></div>
    <div><dt>Référence</dt><dd class="mono" th:text="${ref}">REF</dd></div>
  </dl>

  <div th:replace="~{fragments/page :: foot('Elle A Osé · Pointe-Noire')}"></div>
</main>
</body>
</html>
