<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document introuvable — Bokati Cowork</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; font-size: 14px; }
        .topbar { background: #0f172a; padding: 14px 20px; }
        .topbar-brand { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px; }
        .topbar-sub { color: #94a3b8; font-size: 11px; margin-top: 2px; }
        .container { max-width: 480px; margin: 60px auto; padding: 0 16px; text-align: center; }
        .icon { font-size: 56px; margin-bottom: 20px; }
        .title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #64748b; line-height: 1.6; }
        .ref { display: inline-block; margin-top: 16px; background: #fee2e2; color: #991b1b; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; }
        .footer { margin-top: 40px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-brand">BOKATI COWORK</div>
    <div class="topbar-sub">Vérification de document</div>
</div>
<div class="container">
    <div class="icon">⚠️</div>
    <div class="title">Document introuvable</div>
    <div class="subtitle">
        Le <span th:text="${type}">document</span> demandé n'existe pas ou a été supprimé.<br>
        Vérifiez que le QR code scanné est bien intact et lisible.
    </div>
    <div class="ref" th:text="${ref}">REF</div>
    <div class="footer">Bokati Cowork — Vérification officielle de documents</div>
</div>
</body>
</html>
