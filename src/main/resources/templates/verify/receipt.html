<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/page :: pagehead(|Reçu ${receipt.receiptNumber()} · Elle A Osé|)}"></head>
<body>
<main class="page">
  <div th:replace="~{fragments/page :: brand}"></div>
  <div th:replace="~{fragments/page :: brand-rule}"></div>

  <p class="state ok">Encaissé</p>
  <h1>Reçu de paiement</h1>
  <p class="lede" th:text="|Ce reçu atteste d'un règlement enregistré par Elle A Osé le ${generatedAt}.|">Description</p>

  <dl class="rows">
    <div><dt>Reçu</dt><dd class="mono" th:text="${receipt.receiptNumber()}">REF</dd></div>
    <div><dt>Transaction</dt><dd class="mono" th:text="${receipt.transactionNumber()}">TRX</dd></div>
    <div><dt>Moyen</dt><dd th:text="${receipt.paymentMethod()}">Moyen</dd></div>
    <div th:if="${receipt.depositId() != null}"><dt>Dépôt</dt><dd class="mono" th:text="${receipt.depositId()}">ID</dd></div>
    <div th:if="${receipt.payerPhone() != null}"><dt>Payeur</dt><dd class="mono" th:text="${receipt.payerPhone()}">Tél.</dd></div>
    <div th:if="${receipt.providerReference() != null and receipt.paymentMethod()?.name() != 'MOBILE_MONEY'}">
      <dt>Référence</dt><dd class="mono" th:text="${receipt.providerReference()}">Réf.</dd></div>
    <div><dt>Statut</dt><dd th:text="${receipt.transactionStatus()}">Statut</dd></div>
  </dl>

  <p class="state ok" style="margin-top:24px">Montants</p>
  <dl class="rows">
    <div th:each="allocation : ${receipt.allocations()}">
      <dt th:text="${allocation.title() != null ? allocation.title() : allocation.documentType()}">Document</dt>
      <dd th:text="${fmt.money(allocation.allocatedAmount())}">0</dd>
    </div>
    <div th:if="${receipt.advanceAmount() != null and receipt.advanceAmount().signum() > 0}">
      <dt>Dont acompte</dt><dd th:text="${fmt.money(receipt.advanceAmount())}">0</dd></div>
    <div><dt>Total réglé</dt><dd th:text="${fmt.money(receipt.paidAmount())}">0</dd></div>
  </dl>

  <div th:replace="~{fragments/page :: foot('Elle A Osé · 84 Boulevard du Général Charles de Gaulle, Pointe-Noire · RCCM CG-PNR-01-2017-A11-00472')}"></div>
</main>
</body>
</html>
