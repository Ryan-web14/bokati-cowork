<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/fragments/notice-layout :: head('Paiement en attente')}"></head>
<body>
<div style="display:none; font-size:1px; color:#ffffff; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;"
     th:text="${preheader != null ? preheader : 'Votre paiement en attente expire bientôt.'}">Votre paiement en attente expire bientôt.</div>
<div class="wrap">
  <div class="sheet">
    <div th:replace="~{email/fragments/notice-layout :: header('warn')}"></div>

    <div class="em-body">
      <div class="em-title">Paiement en attente</div>
      <div class="em-intro">
        Bonjour <strong th:text="${customerName ?: 'client'}">client</strong>, votre paiement pour la facture
        <strong th:text="${documentNumber}">FAC-000</strong> expire le <strong th:text="${expiresAt}">date</strong>.
      </div>
      <div class="amount"><span th:text="${amount}">0</span> <small th:text="${currency}">XAF</small></div>
      <div class="em-note warn">Merci de procéder au règlement avant cette date pour éviter l'annulation.</div>
      <div th:replace="~{email/fragments/notice-layout :: legal}"></div>
    </div>

    <div th:replace="~{email/fragments/notice-layout :: footer}"></div>
  </div>
</div>
</body>
</html>
