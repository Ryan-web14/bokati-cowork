<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/fragments/notice-layout :: head('Signature de votre devis')}"></head>
<body>
<div style="display:none; font-size:1px; color:#ffffff; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;"
     th:text="${preheader != null ? preheader : 'Votre devis est prêt à être signé.'}">Votre devis est prêt à être signé.</div>
<div class="wrap">
  <div class="sheet">
    <div th:replace="~{email/fragments/notice-layout :: header('')}"></div>

    <div class="em-body">
      <div class="em-title">Signature de votre devis</div>
      <div class="em-intro">
        Bonjour <strong th:text="${signerName ?: 'client'}">client</strong>, le devis <strong th:text="${quoteNumber}">DEV-000</strong>
        est prêt à être signé électroniquement.
      </div>
      <div class="em-intro" th:if="${customMessage != null and customMessage != ''}" th:text="${customMessage}">Message</div>
      <a class="cta" th:href="${signatureUrl}" href="https://espace.elleaose.com">Signer le devis</a>
      <div class="em-note">Ce lien est valable 7 jours. Si vous n'êtes pas à l'origine de cette demande, ignorez ce courriel.</div>
      <div th:replace="~{email/fragments/notice-layout :: legal}"></div>
    </div>

    <div th:replace="~{email/fragments/notice-layout :: footer}"></div>
  </div>
</div>
</body>
</html>
