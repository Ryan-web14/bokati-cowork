<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/fragments/notice-layout :: head('Abonnement termine')}"></head>
<body>
<div style="display:none; font-size:1px; color:#ffffff; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;"
     th:text="${preheader != null ? preheader : 'Votre abonnement a pris fin.'}">Votre abonnement a pris fin.</div>
<div class="wrap">
  <div class="sheet">
    <div th:replace="~{email/fragments/notice-layout :: header('')}"></div>

    <div class="em-body">
      <div class="em-title">Votre abonnement a pris fin</div>
      <div class="em-intro">
        Bonjour <strong th:text="${recipientName ?: 'client'}">client</strong>, votre abonnement
        <strong th:text="${subscriptionNumber}">référence</strong> s'est achevé le
        <strong th:text="${periodEnd}">date</strong>, comme annoncé. Vos accès sont désormais clos.
      </div>

      <div class="em-note">
        Vous restez le bienvenu · pour reprendre un abonnement, passez à l'accueil ou souscrivez
        depuis votre espace client.
      </div>

      <div th:replace="~{email/fragments/notice-layout :: legal}"></div>
    </div>

    <div th:replace="~{email/fragments/notice-layout :: footer}"></div>
  </div>
</div>
</body>
</html>
