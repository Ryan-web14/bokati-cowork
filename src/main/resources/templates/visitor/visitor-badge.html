<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Badge visiteur</title>
    <style>
        @page { size: A6 landscape; margin: 0; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #ffffff;
            width: 148mm;
            height: 105mm;
            overflow: hidden;
        }

        .badge {
            width: 148mm;
            height: 105mm;
            background: #1a0a2e;
            position: relative;
        }

        .accent-top {
            height: 4px;
            background: #c9a84c;
        }

        .inner {
            padding: 10mm 10mm 8mm;
            height: 101mm;
        }

        .layout-table { width: 100%; border-collapse: collapse; height: 100%; }
        .layout-table td { border: none; vertical-align: top; padding: 0; }
        .col-left { width: 58mm; padding-right: 8mm; }
        .col-right { width: 38mm; text-align: center; }

        .badge-type {
            font-size: 7px; font-weight: 700; color: #c9a84c;
            letter-spacing: 3px; text-transform: uppercase;
            margin-bottom: 6mm;
        }

        .visitor-name {
            font-size: 20px; font-weight: 700; color: #ffffff;
            line-height: 1.2; margin-bottom: 2mm;
        }

        .visitor-company {
            font-size: 11px; color: #9b8caa; margin-bottom: 5mm;
        }

        .info-block { margin-bottom: 3mm; }
        .info-label {
            font-size: 6.5px; font-weight: 700; color: #9b8caa;
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 1mm;
        }
        .info-value { font-size: 10px; color: #ffffff; font-weight: 600; }
        .info-value.gold { color: #c9a84c; }

        .divider { height: 1px; background: rgba(255,255,255,0.12); margin: 4mm 0; }

        .host-label { font-size: 6.5px; color: #9b8caa; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1mm; }
        .host-name { font-size: 11px; color: #c9a84c; font-weight: 700; }

        .qr-label {
            font-size: 6px; font-weight: 700; color: #c9a84c;
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 5mm;
        }

        .pass-number {
            font-size: 7px; color: #9b8caa; margin-top: 5mm;
            letter-spacing: 0.5px; word-break: break-all;
        }

        .brand-footer {
            position: absolute;
            bottom: 6mm; left: 10mm;
            font-size: 6px; color: rgba(255,255,255,0.3);
            letter-spacing: 1px; text-transform: uppercase;
        }

        .validity-badge {
            display: inline-block;
            background: rgba(201,168,76,0.2);
            border: 1px solid rgba(201,168,76,0.4);
            color: #c9a84c;
            font-size: 7px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase;
            padding: 2px 8px; border-radius: 10px;
            margin-bottom: 3mm;
        }
    </style>
</head>
<body>
<div class="badge">
    <div class="accent-top"></div>
    <div class="inner">
        <table class="layout-table">
            <tr>
                <td class="col-left">
                    <div class="badge-type">Visiteur</div>
                    <div class="validity-badge">Accès autorisé</div>
                    <div class="visitor-name" th:text="${visitor.fullName}">Nom du visiteur</div>
                    <div class="visitor-company" th:if="${visitor.company}" th:text="${visitor.company}">Entreprise</div>

                    <div class="divider"></div>

                    <div class="info-block">
                        <div class="info-label">Entrée</div>
                        <div class="info-value gold" th:text="${validFrom}"></div>
                    </div>
                    <div class="info-block">
                        <div class="info-label">Sortie prévue</div>
                        <div class="info-value" th:text="${validUntil}"></div>
                    </div>

                    <div class="divider"></div>

                    <div class="host-label">Invité par</div>
                    <div class="host-name" th:text="${pass.hostName ?: ''}">Hôte</div>
                </td>
                <td class="col-right">
                    <div class="qr-label">Scan entrée</div>
                    <img th:if="${qrCode != null}"
                         th:src="@{'data:image/png;base64,' + ${qrCode}}"
                         width="120" height="120" alt="QR Code"/>
                    <div class="pass-number" th:text="${pass.passNumber}">VIS-000000</div>
                </td>
            </tr>
        </table>
        <div class="brand-footer">Elle A Osé · Bokati Cowork</div>
    </div>
</div>
</body>
</html>
