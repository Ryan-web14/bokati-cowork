<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Reçu · ' + ${entry.transactionNumber}">Reçu de transaction</title>
    <style>
        @page { size: A5; margin: 24px 26px; }
        * { box-sizing: border-box; }
        body { font-family: Helvetica, Arial, sans-serif; color: #2b2030; font-size: 10px; line-height: 1.45; }
        .header { border-bottom: 2px solid #d9a21b; padding-bottom: 10px; margin-bottom: 14px; }
        .header-table { width: 100%; border-collapse: collapse; }
        .header-table td { border: none; padding: 0; vertical-align: top; }
        .brand { font-size: 16px; font-weight: 700; color: #281332; letter-spacing: 2px; text-transform: uppercase; }
        .brand-sub { font-size: 8px; color: #6f6478; letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }
        .doc-type { font-size: 16px; font-weight: 700; color: #281332; text-align: right; text-transform: uppercase; letter-spacing: 1.5px; }
        .doc-number { font-size: 10px; color: #d9a21b; text-align: right; font-weight: 700; font-family: "Courier New", monospace; margin-top: 3px; }
        .amount-box { border: 1px solid #d9a21b; background: #fffaf0; padding: 12px 16px; margin: 12px 0; text-align: center; }
        .amount-box .label { font-size: 8px; color: #6f6478; text-transform: uppercase; letter-spacing: 1px; }
        .amount-box .value { font-size: 22px; font-weight: 700; color: #281332; margin-top: 4px; }
        table.info { width: 100%; border-collapse: collapse; }
        table.info td { padding: 4px 8px; border-bottom: 1px solid #efe9f2; vertical-align: top; }
        table.info td.label { color: #6f6478; width: 40%; font-weight: 600; }
        table.info td.value { font-weight: 600; }
        .mono { font-family: "Courier New", monospace; font-size: 8.5px; word-break: break-all; }
        .footer { margin-top: 18px; font-size: 7.6px; color: #9b8caa; text-align: center; }
    </style>
</head>
<body>
<div class="header">
    <table class="header-table">
        <tr>
            <td>
                <div class="brand">Bokati Cowork</div>
                <div class="brand-sub">Portefeuille client</div>
            </td>
            <td>
                <div class="doc-type">Reçu</div>
                <div class="doc-number" th:text="${entry.transactionNumber}">WTX</div>
            </td>
        </tr>
    </table>
</div>

<div class="amount-box">
    <div class="label" th:text="${directionLabel}">Montant</div>
    <div class="value" th:text="${amount} + ' ' + ${entry.currency}">0</div>
</div>

<table class="info">
    <tr><td class="label">Date</td><td class="value" th:text="${date}">date</td></tr>
    <tr><td class="label">Portefeuille</td><td class="value" th:text="${entry.walletNumber}">WAL</td></tr>
    <tr><td class="label">Titulaire</td><td class="value" th:text="${holderName}">Nom</td></tr>
    <tr><td class="label">Nature</td><td class="value" th:text="${nature}">nature</td></tr>
    <tr th:if="${entry.reference != null}"><td class="label">Libellé</td><td class="value" th:text="${entry.reference}">libellé</td></tr>
    <tr th:if="${entry.sourceCode != null}"><td class="label">Origine</td><td class="value mono" th:text="${entry.sourceType} + ' · ' + ${entry.sourceCode}">origine</td></tr>
    <tr><td class="label">Solde après opération</td><td class="value" th:text="${balanceAfter} + ' ' + ${entry.currency}">0</td></tr>
    <tr><td class="label">Identifiant</td><td class="value mono" th:text="${entry.transactionUuid}">uuid</td></tr>
</table>

<div class="footer">
    Ce reçu est extrait du journal chaîné du portefeuille. Sa référence suffit à retrouver l'écriture.
</div>
</body>
</html>
