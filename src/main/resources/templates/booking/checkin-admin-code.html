<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/page :: pagehead('Code du poste · Elle A Osé')}"></head>
<body>
<main class="page">
  <div th:replace="~{fragments/page :: brand}"></div>
  <div th:replace="~{fragments/page :: brand-rule}"></div>

  <th:block th:if="${scannerConfigured}">
    <p class="state todo">Action requise</p>
    <h1>Code de l'accueil</h1>
    <p class="lede">Saisissez le code du poste pour enregistrer cette arrivée.</p>

    <p class="notice" th:if="${error != null}" style="border-left-color:#A32A34; color:#A32A34; margin-top:0; margin-bottom:16px" th:text="${error}">Message</p>

    <form th:action="@{${verifyUrl}}" method="post">
      <input type="hidden" name="checkInToken" th:value="${checkInToken}">
      <div class="field">
        <label for="adminCode">Code du poste</label>
        <input type="password" id="adminCode" name="adminCode" required autocomplete="off" inputmode="numeric">
      </div>
      <button type="submit" class="btn">Enregistrer l'arrivée</button>
    </form>
  </th:block>

  <th:block th:unless="${scannerConfigured}">
    <p class="state ko">Poste non configuré</p>
    <h1>Ce poste n'est pas encore activé</h1>
    <p class="lede">Activez-le depuis la page de configuration du scanner avant d'enregistrer des arrivées.</p>
  </th:block>

  <div th:replace="~{fragments/page :: foot('Elle A Osé · Pointe-Noire')}"></div>
</main>
</body>
</html>
