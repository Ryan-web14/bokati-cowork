<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/page :: pagehead(|Réservation ${bookingNumber} · Elle A Osé|)}"></head>
<body>
<main class="page">
  <div th:replace="~{fragments/page :: brand}"></div>
  <div th:replace="~{fragments/page :: brand-rule}"></div>

  <p class="state ok">Confirmée</p>
  <h1>Réservation confirmée</h1>
  <p class="lede" th:text="|Au nom de ${recipientName}. Présentez le code ci-dessous à l'accueil, ou scannez-le sur la borne.|">Description</p>

  <dl class="rows">
    <div><dt>Réservation</dt><dd class="mono" th:text="${bookingNumber}">BKG</dd></div>
    <div><dt>Espace</dt><dd th:text="${resourceName}">Espace</dd></div>
    <div th:if="${resourceType}"><dt>Type</dt><dd th:text="${resourceType}">Type</dd></div>
    <div><dt>Date</dt><dd th:text="${bookingDate}">Date</dd></div>
    <div><dt>Horaire</dt><dd th:text="|${startTime} — ${endTime}|">Horaire</dd></div>
    <div><dt>Durée</dt><dd th:text="${durationLabel}">Durée</dd></div>
    <div th:if="${quantity}"><dt>Places</dt><dd th:text="${quantity}">1</dd></div>
    <div th:if="${address}"><dt>Adresse</dt><dd th:text="|${address}, ${city}|">Adresse</dd></div>
  </dl>

  <p class="state todo" style="margin-top:24px">Montants</p>
  <dl class="rows">
    <div><dt>Total HT</dt><dd th:text="${priceHT}">0</dd></div>
    <div th:if="${priceTVA}"><dt th:text="|TVA ${tvaPct}|">TVA</dt><dd th:text="${priceTVA}">0</dd></div>
    <div th:if="${priceCentimeAdditionnel}"><dt th:text="|Centime ${centimeAdditionnelPct}|">Centime</dt><dd th:text="${priceCentimeAdditionnel}">0</dd></div>
    <div><dt>Total TTC</dt><dd th:text="${priceTTC}">0</dd></div>
  </dl>

  <p class="notice">Code de vérification : <strong th:text="${verificationCode}">—</strong></p>
  <div th:replace="~{fragments/page :: foot('Elle A Osé · 84 Boulevard du Général Charles de Gaulle, Pointe-Noire')}"></div>
</main>
</body>
</html>
