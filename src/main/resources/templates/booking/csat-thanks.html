<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/page :: pagehead('Merci · Elle A Osé')}"></head>
<body>
<main class="page">
  <div th:replace="~{fragments/page :: brand}"></div>
  <div th:replace="~{fragments/page :: brand-rule}"></div>

  <p class="state ok">Enregistré</p>
  <h1>Merci pour votre retour</h1>
  <p class="lede">Votre note nous aide à améliorer l'espace. Vous n'avez rien d'autre à faire.</p>

  <dl class="rows">
    <div th:if="${score >= 1 and score <= 5}"><dt>Note donnée</dt><dd th:text="|${score} sur 5|">—</dd></div>
    <div th:if="${bookingNumber != null}"><dt>Réservation</dt><dd class="mono" th:text="${bookingNumber}">BKG</dd></div>
  </dl>

  <div th:replace="~{fragments/page :: foot('Elle A Osé · Pointe-Noire')}"></div>
</main>
</body>
</html>
