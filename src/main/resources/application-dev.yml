app:
  api-base-url: ${APP_BASE_URL:https://1612-102-129-68-124.ngrok-free.app}
  admin-access-url: ${ADMIN_ACCESS_URL:https://admin.elleaose.com}
  verify-base-url: ${APP_VERIFY_BASE_URL:${APP_BASE_URL:https://1612-102-129-68-124.ngrok-free.app}}

  document:
    storage:
      provider: ${DOCUMENT_STORAGE_PROVIDER:minio}
      root-path: ${DOCUMENT_STORAGE_ROOT_PATH:storage/documents}

      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        bucket: ${MINIO_BUCKET:bokati-documents}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}

    worker:
      enabled: ${DOCUMENT_WORKER_ENABLED:true}
      fixed-delay-ms: ${DOCUMENT_WORKER_FIXED_DELAY_MS:3600000}

  contract:
    worker:
      enabled: ${CONTRACT_WORKER_ENABLED:true}
      fixed-delay-ms: ${CONTRACT_WORKER_FIXED_DELAY_MS:3600000}

  outbox:
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS:10000}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:25}

  kyc:
    ocr:
      enabled: ${KYC_OCR_ENABLED:true}
      provider: ${KYC_OCR_PROVIDER:TESSERACT}
      language: ${KYC_OCR_LANGUAGE:fra+eng}
      data-path: ${KYC_OCR_DATA_PATH:storage/tessdata}

  security:
    auto-admin:
      enabled: ${AUTO_ADMIN_SECURITY_CONTEXT_ENABLED:true}
      email: ${AUTO_ADMIN_EMAIL:admin@bokati.com}

    failed-login:
      max-attempts: ${FAILED_LOGIN_MAX_ATTEMPTS:5}

    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}

      login:
        max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}

      otp:
        max-requests: ${RATE_LIMIT_OTP_MAX_REQUESTS:3}
        window-seconds: ${RATE_LIMIT_OTP_WINDOW_SECONDS:600}

      callback:
        max-requests: ${RATE_LIMIT_CALLBACK_MAX_REQUESTS:120}
        window-seconds: ${RATE_LIMIT_CALLBACK_WINDOW_SECONDS:60}

      admin:
        max-requests: ${RATE_LIMIT_ADMIN_MAX_REQUESTS:600}
        window-seconds: ${RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}

    jwt:
