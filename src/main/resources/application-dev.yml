spring:
  application:
    name: bokati-cowork

  datasource:
    url: jdbc:postgresql://localhost:5434/cowork_dev_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      max-lifetime: 1000

  jpa:
    database: postgresql
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false

  mail:
    microsoft:
      graph:
        client-id: ${MICROSOFT_GRAPH_CLIENT_ID:80eab8f6-815f-4e41-bcc5-1a08e6191949}
        client-secret: ${MICROSOFT_GRAPH_CLIENT_SECRET:jpj8Q~j4pgjkI4DBLCIBN_r3GbCoI7IVEoemfaiE}
        tenant-id: ${MICROSOFT_GRAPH_TENANT_ID:e1006690-4205-4c71-9f74-1b9fdcbdcaf2}
        sender-email: ${MICROSOFT_SENDER_EMAIL:no-reply@elleaose.com}

gg:
  jte:
    development-mode: true
    use-precompiled-templates: false

logging:
  level:
    com.sni.bokaticowork: DEBUG
    com.sni.ohadabokati: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

debug: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

  datadog:
    metrics:
      export:
        enabled: false

  defaults:
    metrics:
      export:
        enabled: false

