spring:

  datasource:
    url: jdbc:postgresql://localhost:5434/cowork_dev_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
      minimum-idle: 5
      max-lifetime: 1000


  mail:
    microsoft:
      graph:
        client-id: ${MICROSOFT_GRAPH_CLIENT_ID:80eab8f6-815f-4e41-bcc5-1a08e6191949}
        client-secret: ${MICROSOFT_GRAPH_CLIENT_SECRET:jpj8Q~j4pgjkI4DBLCIBN_r3GbCoI7IVEoemfaiE}
        tenant-id: ${MICROSOFT_GRAPH_TENANT_ID:e1006690-4205-4c71-9f74-1b9fdcbdcaf2}
        sender-email: ${MICROSOFT_SENDER_EMAIL:no-reply@elleaose.com}



  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: public
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 3
    default-schema: public
    schemas: public
    out-of-order: false


logging:
  level:
    com.sni.ohadabokati: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
debug: true

