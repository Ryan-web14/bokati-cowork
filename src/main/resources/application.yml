spring:
  application:
    name: bokati-cowork

  profiles:
    active: prod

  jpa:
    database: postgresql
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    baseline-version: 3

gg:
  jte:
    use-precompiled-templates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics