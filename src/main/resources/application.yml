
spring:
  application:
    name: bokati-cowork
  profiles:
    active: prod




  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    deserialization:
      # Une propriete inconnue est refusee au lieu d'etre ignoree. Sans cela une clef mal
      # orthographiee ne produit aucune erreur : le champ est simplement jete, et ce qui en
      # dependait cesse de s'appliquer en silence. C'est ainsi que catalogSourceCode a desarme
      # le plancher de prix et le taux de remise maximal sans le moindre message.
      #
      # Le durcissement porte sur TOUTES les requetes de l'API. Passer API_STRICT_PAYLOAD a
      # false le desactive sans redeploiement, si une integration tierce envoyait des champs
      # superflus.
      fail-on-unknown-properties: ${API_STRICT_PAYLOAD:true}

  jpa:
    database: postgresql
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  locale: ${APP_LOCALE:fr_FR}
  documents:
    # When true, GET /documents/{code}/signed-preview is reachable without a bearer token,
    # authorized instead by a short-lived signed ?token= (issued by GET /{code}/preview-token).
    # Lets browsers load images via <img src> without exposing the JWT or being enumerable.
    # Plain /preview and /download stay authenticated. Set to false to disable it entirely.
    public-preview-enabled: ${DOCUMENTS_PUBLIC_PREVIEW_ENABLED:true}
    preview-token:
      # Lifetime for signed preview tokens. Signing secret defaults to the JWT secret
      # (override with DOCUMENTS_PREVIEW_TOKEN_SECRET); see DocumentAccessTokenService.
      ttl-seconds: ${DOCUMENTS_PREVIEW_TOKEN_TTL_SECONDS:300}
  portal:
    kyc-grace-period-days: ${PORTAL_KYC_GRACE_PERIOD_DAYS:7}
  event:
    notification-email: ${EVENT_NOTIFICATION_EMAIL:coworkspace@elleaose.com}
    opening-code: ${OPENING_EVENT_CODE:OUVERTURE}
  company:
    name: ${COMPANY_NAME:Elle a Osé}
    legal-name: ${COMPANY_LEGAL_NAME:Elle a Osé}
    niu: ${COMPANY_NIU:}
    fiscal-id: ${COMPANY_FISCAL_ID:000000}
    machine-code: ${COMPANY_MACHINE_CODE:00000}

billing:
  fiscal:
    signing-key: ${BILLING_FISCAL_SIGNING_KEY}

bokati:
  maintenance:
    member-purge:
      # Suppression definitive d'un membre et de toutes ses donnees (facture, portefeuille,
      # contrat, abonnement, reservation, compte utilisateur). Irreversible et sans sauvegarde.
      # Se declenche uniquement sur DELETE /members/{id}?purge=true ou sur les points d'entree
      # /admin/maintenance/members : l'archivage reste le comportement par defaut du retrait d'un
      # membre. Mettre a false pour fermer completement la capacite ; la previsualisation, en
      # lecture seule, reste accessible dans les deux cas.
      enabled: ${MEMBER_PURGE_ENABLED:true}
      max-batch-size: ${MEMBER_PURGE_MAX_BATCH_SIZE:25}
  booking:
    wallet:
      # Reservation reglee au portefeuille : les fonds sont bloques a la confirmation, ce qui vaut
      # paiement · la reservation est confirmee immediatement. Le debit comptable suit en
      # arriere-plan une fois ce delai ecoule. L'intervalle est la fenetre de retractation · une
      # annulation pendant ce laps rend les fonds sans qu'aucune ecriture comptable n'ait eu lieu,
      # donc sans avoir ni remboursement.
      settlement-delay-minutes: ${BOOKING_WALLET_SETTLEMENT_DELAY_MINUTES:1}
      # Marge de securite portee par le blocage lui-meme, au-dela du delai de reglement. Elle ne
      # sert jamais en fonctionnement normal : elle garantit qu'un blocage orphelin finira par
      # etre rendu au client meme si plus aucun traitement ne le reclame.
      hold-grace-minutes: ${BOOKING_WALLET_HOLD_GRACE_MINUTES:60}
      # Cadence de l'encaissement. Elle borne la derive du delai ci-dessus : un debit tombe entre
      # 1 min et 1 min 15.
      worker-delay-ms: ${BOOKING_WALLET_WORKER_DELAY_MS:15000}
  websocket:
    use-stomp-relay: ${BOKATI_WEBSOCKET_USE_STOMP_RELAY:false}
    stomp:
      relay-host: ${BOKATI_STOMP_RELAY_HOST:localhost}
      relay-port: ${BOKATI_STOMP_RELAY_PORT:61613}
      virtual-host: ${BOKATI_STOMP_VIRTUAL_HOST:/}
      client-login: ${BOKATI_STOMP_CLIENT_LOGIN:guest}
      client-passcode: ${BOKATI_STOMP_CLIENT_PASSCODE:}
      system-login: ${BOKATI_STOMP_SYSTEM_LOGIN:guest}
      system-passcode: ${BOKATI_STOMP_SYSTEM_PASSCODE:}
  email:
    # Deduplication window per outbound mail. Mail carrying a business reference (invoice,
    # contract, KYC case) is keyed on that reference; everything else falls back to
    # recipient + subject, so its window stays short.
    dedup:
      enabled: ${EMAIL_DEDUP_ENABLED:true}
      business-window-seconds: ${EMAIL_DEDUP_BUSINESS_WINDOW_SECONDS:86400}
      generic-window-seconds: ${EMAIL_DEDUP_GENERIC_WINDOW_SECONDS:3600}
  graph-api:
    rate-limit:
      # Exchange Online caps a mailbox at roughly 30 messages/minute; this limiter is also
      # per-instance, so the effective ceiling is this value times the number of dynos.
      limit-for-period: ${GRAPH_RATE_LIMIT:25}
      limit-refresh-period-ms: ${GRAPH_RATE_LIMIT_REFRESH_MS:60000}
      timeout-ms: ${GRAPH_RATE_LIMIT_TIMEOUT_MS:30000}
  pdf:
    signature:
      # Signature PAdES des documents scellés · seul mécanisme qui fait qu'un lecteur PDF signale
      # de lui-même qu'un document a été modifié, sans démarche du destinataire.
      #
      # Avec un certificat auto-signé, le lecteur affiche « signature valide, émetteur non
      # vérifié » · bandeau jaune plutôt que vert. L'essentiel est acquis pour autant : le
      # bandeau change dès qu'un octet bouge. Passer à une autorité reconnue ne changera pas une
      # ligne de code, seulement la source du keystore.
      #
      # Générer un keystore de développement :
      #   keytool -genkeypair -alias bokati -keyalg RSA -keysize 2048 -validity 3650 \
      #           -storetype PKCS12 -keystore storage/pdf-signing.p12 -storepass changeit \
      #           -dname "CN=Elle a Ose, OU=Bokati Cowork, O=SNI, L=Brazzaville, C=CG"
      #
      # En production, fournir le keystore en base64 (PDF_SIGNATURE_KEYSTORE_BASE64) · une clé
      # privée ne va jamais dans le dépôt. Sa compromission permettrait de signer de faux
      # documents : prévoir la rotation avant la mise en service.
      enabled: ${PDF_SIGNATURE_ENABLED:false}
      keystore-base64: ${PDF_SIGNATURE_KEYSTORE_BASE64:}
      keystore-path: ${PDF_SIGNATURE_KEYSTORE_PATH:}
      keystore-password: ${PDF_SIGNATURE_KEYSTORE_PASSWORD:}
      alias: ${PDF_SIGNATURE_ALIAS:bokati}
      reason: ${PDF_SIGNATURE_REASON:Document emis par Bokati Cowork}
      location: ${PDF_SIGNATURE_LOCATION:Brazzaville, Congo}
  billing:
    discount-guard:
      # Limites de remise fixees par configuration, en complement de celles portees par chaque
      # article du catalogue (floor_price, max_discount_rate, discount_policy).
      # enabled ne gouverne que les limites ci-dessous · celles du catalogue relevent de la
      # politique propre a chaque article et restent actives.
      # Le depassement reste possible avec la permission BILLING:DISCOUNT_OVERRIDE et un motif.
      enabled: ${BILLING_DISCOUNT_GUARD_ENABLED:true}

      # Repli par ligne · part minimale du montant de base conservee apres remise. Couvre le cas
      # le plus courant et le moins surveille : la ligne libre, saisie sans article, qui
      # echapperait sinon a tout controle. A 50, une ligne de 10 000 ne descend pas sous 5 000.
      default-min-net-rate: ${BILLING_MIN_LINE_NET_RATE:50}
      # Montant net minimal absolu par ligne · vide, seul le taux ci-dessus s'applique.
      min-line-net-amount: ${BILLING_MIN_LINE_NET_AMOUNT:}

      # Seuil global · porte sur la remise TOTALE, remises de ligne comprises. Ne compter que la
      # remise document laisserait le contourner en eclatant la meme remise sur les lignes.
      max-document-discount-rate: ${BILLING_MAX_DOCUMENT_DISCOUNT_RATE:50}
      # Vide : seul le taux s'applique.
      max-document-discount-amount: ${BILLING_MAX_DOCUMENT_DISCOUNT_AMOUNT:}
    workers:
      fiscal-integrity-cron:  ${BILLING_FISCAL_INTEGRITY_CRON:0 0 2 * * *}
      daily-closure-cron:     ${BILLING_DAILY_CLOSURE_CRON:0 30 23 * * *}
      monthly-closure-cron:   ${BILLING_MONTHLY_CLOSURE_CRON:0 15 0 1 * *}
      annual-closure-cron:    ${BILLING_ANNUAL_CLOSURE_CRON:0 0 1 1 1 *}
  checkin:
    # Cle partagee par tous les postes de pointage. Elle ne circule plus dans le cookie du
    # poste : celui-ci porte une autorisation signee par elle. La changer revoque donc tous
    # les postes d un coup.
    scanner-key: ${CHECKIN_SCANNER_KEY:}
    # Duree de vie de l autorisation posee sur un poste. Le cookie precedent durait un an et
    # contenait la cle elle-meme · il n expirait jamais utilement.
    scanner-grant-validity-days: ${CHECKIN_SCANNER_GRANT_VALIDITY_DAYS:30}
    # A ne mettre a false qu en local, ou un navigateur refuse de garder un cookie Secure
    # servi en HTTP.
    scanner-cookie-secure: ${CHECKIN_SCANNER_COOKIE_SECURE:true}
    early-window-minutes: ${CHECKIN_EARLY_WINDOW_MINUTES:15}
    location:
      latitude: ${CHECKIN_LOCATION_LAT:0}
      longitude: ${CHECKIN_LOCATION_LNG:0}
      radius-meters: ${CHECKIN_LOCATION_RADIUS:200}
  task:
    reminder-cron: ${TASK_REMINDER_CRON:0 0 * * * *}
    due-soon-hours: ${TASK_DUE_SOON_HOURS:24}
    booking-prep-hours: ${TASK_BOOKING_PREP_HOURS:2}
    booking-default-assignee: ${TASK_BOOKING_DEFAULT_ASSIGNEE:}
    booking-cleanup-default-assignee: ${TASK_BOOKING_CLEANUP_DEFAULT_ASSIGNEE:}
    inventory-reorder-due-hours: ${TASK_INVENTORY_REORDER_DUE_HOURS:24}
    inventory-default-assignee: ${TASK_INVENTORY_DEFAULT_ASSIGNEE:}

inventory:
  worker:
    # Cadences du worker inventaire. Les valeurs par defaut sont portees par les annotations
    # @Scheduled ; elles sont reprises ici pour rester pilotables par variable d'environnement.
    reservation-cron:    ${INVENTORY_RESERVATION_CRON:0 */30 * * * *}
    expiry-cron:         ${INVENTORY_EXPIRY_CRON:0 0 */2 * * *}
    slow-moving-cron:    ${INVENTORY_SLOW_MOVING_CRON:0 0 */6 * * *}
    asset-cron:          ${INVENTORY_ASSET_CRON:0 0 */3 * * *}
    # Reconciliation des niveaux de stock avec le journal de mouvements, chaque lundi a 3h.
    reconciliation-cron: ${INVENTORY_RECONCILIATION_CRON:0 0 3 * * MON}

idempotency:
  # Operations pour lesquelles l'en-tete Idempotency-Key devient obligatoire, meme si
  # l'annotation @Idempotent les declare en required = false. Vide par defaut : activer
  # operation par operation, apres avoir prevenu les clients de l'API.
  # Exemple : INVENTORY_STOCK_IN,INVENTORY_STOCK_OUT,INVENTORY_STOCK_TRANSFER,INVENTORY_STOCK_ADJUST
  required-operations: ${IDEMPOTENCY_REQUIRED_OPERATIONS:}
