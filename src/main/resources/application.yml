spring:
  application:
    name: bokati-cowork
  profiles:
    active: dev



  jpa:
    database: postgresql
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true



  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    baseline-version: 3

gg:
  jte:
    development-mode: true


logging:
  level:
    com.sni.bokaticowork: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

bokati:
  payment:
    pawaypay:
      enabled: false
      api-key: ${PAWAYPAY_API_KEY:}
      base-url: ${PAWAYPAY_BASE_URL:https://api.sandbox.pawapay.io}
      callback-base-url: ${APP_BASE_URL:http://localhost:8080}
      callback-secret: ${PAWAYPAY_CALLBACK_SECRET:}
      polling-delay-ms: 300000
      polling-max-age-minutes: 10

app:
  document:
    storage:
      root-path: storage/documents
    worker:
      enabled: true
      fixed-delay-ms: 3600000
  contract:
    worker:
      enabled: true
      fixed-delay-ms: 3600000
  outbox:
    worker:
      enabled: true
      fixed-delay-ms: 10000
      batch-size: 25
  security:
    jwt:
      secret: ${APP_JWT_SECRET:change-this-development-jwt-secret-key-please-change-32-bytes}
      access-token-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
      verification-token-expiration-ms: ${APP_JWT_VERIFICATION_EXPIRATION_MS:900000}
    one-time-token:
      expiration-ms: ${APP_OTT_EXPIRATION_MS:900000}
    password-reset:
      expiration-ms: ${APP_PASSWORD_RESET_EXPIRATION_MS:900000}



