
spring:
  application:
    name: bokati-cowork
  profiles:
    active: prod

  jpa:
    database: postgresql
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  portal:
    kyc-grace-period-days: ${PORTAL_KYC_GRACE_PERIOD_DAYS:7}

bokati:
  task:
    reminder-cron: ${TASK_REMINDER_CRON:0 0 * * * *}
    due-soon-hours: ${TASK_DUE_SOON_HOURS:24}
    booking-prep-hours: ${TASK_BOOKING_PREP_HOURS:2}
    booking-default-assignee: ${TASK_BOOKING_DEFAULT_ASSIGNEE:}
    booking-cleanup-default-assignee: ${TASK_BOOKING_CLEANUP_DEFAULT_ASSIGNEE:}
    inventory-reorder-due-hours: ${TASK_INVENTORY_REORDER_DUE_HOURS:24}
    inventory-default-assignee: ${TASK_INVENTORY_DEFAULT_ASSIGNEE:}
