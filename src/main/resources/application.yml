spring:
  application:
    name: bokati-cowork
  profiles:
    active: prod



  jpa:
    database: postgresql
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true



  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    baseline-version: 3

gg:
  jte:
    development-mode: true


logging:
  level:
    com.sni.bokaticowork: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

bokati:
  payment:
    cash-session:
      auto-limit: ${CASH_SESSION_AUTO_LIMIT:10000000}
    pawaypay:
      enabled: false
      api-key: ${PAWAYPAY_API_KEY:}
      base-url: ${PAWAYPAY_BASE_URL:https://api.pawapay.io}
      callback-base-url: ${APP_BASE_URL:https://21a1-102-129-81-86.ngrok-free.app}
      callback-secret: ${PAWAYPAY_CALLBACK_SECRET:}
      polling-delay-ms: 300000
      polling-max-age-minutes: 10


app:
  api-base-url: ${APP_BASE_URL:}
  admin-access-url: ${ADMIN_ACCESS_URL:https://admin.elleaose.com}
  verify-base-url: ${APP_BASE_URL:https://b75b-102-129-75-150.ngrok-free.app}
  document:
    storage:
      provider: ${DOCUMENT_STORAGE_PROVIDER:filesystem}
      root-path: storage/documents
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        bucket: ${MINIO_BUCKET:bokati-documents}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
    worker:
      enabled: true
      fixed-delay-ms: 3600000
  contract:
    worker:
      enabled: true
      fixed-delay-ms: 3600000
  outbox:
    worker:
      enabled: true
      fixed-delay-ms: 10000
      batch-size: 25
  kyc:
    ocr:
      enabled: true
      provider: TESSERACT
      language: fra+eng
      data-path: storage/tessdata
  security:
    auto-admin:
      enabled: ${AUTO_ADMIN_SECURITY_CONTEXT_ENABLED:true}
      email: ${AUTO_ADMIN_EMAIL:admin@bokati.com}
    failed-login:
      max-attempts: ${FAILED_LOGIN_MAX_ATTEMPTS:5}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login:
        max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
      otp:
        max-requests: ${RATE_LIMIT_OTP_MAX_REQUESTS:3}
        window-seconds: ${RATE_LIMIT_OTP_WINDOW_SECONDS:600}
      callback:
        max-requests: ${RATE_LIMIT_CALLBACK_MAX_REQUESTS:120}
        window-seconds: ${RATE_LIMIT_CALLBACK_WINDOW_SECONDS:60}
      admin:
        max-requests: ${RATE_LIMIT_ADMIN_MAX_REQUESTS:600}
        window-seconds: ${RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}
    jwt:
      secret: ${APP_JWT_SECRET:2wV8qK7pN4zR6mT9yB3cF5hJ8sL1dG4x}
      access-token-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
      verification-token-expiration-ms: ${APP_JWT_VERIFICATION_EXPIRATION_MS:900000}
    one-time-token:
      expiration-ms: ${APP_OTT_EXPIRATION_MS:900000}
    password-reset:
      expiration-ms: ${APP_PASSWORD_RESET_EXPIRATION_MS:900000}
    token-hash:
      secret: ${TOKEN_HASH_SECRET:K8sL2vQ9xM4pZ7tN1cR6aB3eY5uH0jD}
