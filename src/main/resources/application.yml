
spring:
  application:
    name: bokati-cowork
  profiles:
    active: prod




  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    database: postgresql
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  locale: ${APP_LOCALE:fr_FR}
  documents:
    # When true, GET /documents/{code}/signed-preview is reachable without a bearer token,
    # authorized instead by a short-lived signed ?token= (issued by GET /{code}/preview-token).
    # Lets browsers load images via <img src> without exposing the JWT or being enumerable.
    # Plain /preview and /download stay authenticated. Set to false to disable it entirely.
    public-preview-enabled: ${DOCUMENTS_PUBLIC_PREVIEW_ENABLED:true}
    preview-token:
      # Lifetime for signed preview tokens. Signing secret defaults to the JWT secret
      # (override with DOCUMENTS_PREVIEW_TOKEN_SECRET); see DocumentAccessTokenService.
      ttl-seconds: ${DOCUMENTS_PREVIEW_TOKEN_TTL_SECONDS:300}
  portal:
    kyc-grace-period-days: ${PORTAL_KYC_GRACE_PERIOD_DAYS:7}
  event:
    notification-email: ${EVENT_NOTIFICATION_EMAIL:coworkspace@elleaose.com}
    opening-code: ${OPENING_EVENT_CODE:OUVERTURE}
  company:
    name: ${COMPANY_NAME:Elle a Osé}
    legal-name: ${COMPANY_LEGAL_NAME:Elle a Osé}
    niu: ${COMPANY_NIU:}
    fiscal-id: ${COMPANY_FISCAL_ID:000000}
    machine-code: ${COMPANY_MACHINE_CODE:00000}

billing:
  fiscal:
    signing-key: ${BILLING_FISCAL_SIGNING_KEY:12f70020a5b8526752f2f245f2148ea881223390f356e0e8246ccde588042d8f}

bokati:
  maintenance:
    member-purge:
      # Suppression definitive d'un membre et de toutes ses donnees (facture, portefeuille,
      # contrat, abonnement, reservation, compte utilisateur). Irreversible et sans sauvegarde.
      # Se declenche uniquement sur DELETE /members/{id}?purge=true ou sur les points d'entree
      # /admin/maintenance/members : l'archivage reste le comportement par defaut du retrait d'un
      # membre. Mettre a false pour fermer completement la capacite ; la previsualisation, en
      # lecture seule, reste accessible dans les deux cas.
      enabled: ${MEMBER_PURGE_ENABLED:true}
      max-batch-size: ${MEMBER_PURGE_MAX_BATCH_SIZE:25}
  websocket:
    use-stomp-relay: ${BOKATI_WEBSOCKET_USE_STOMP_RELAY:false}
    stomp:
      relay-host: ${BOKATI_STOMP_RELAY_HOST:localhost}
      relay-port: ${BOKATI_STOMP_RELAY_PORT:61613}
      virtual-host: ${BOKATI_STOMP_VIRTUAL_HOST:/}
      client-login: ${BOKATI_STOMP_CLIENT_LOGIN:guest}
      client-passcode: ${BOKATI_STOMP_CLIENT_PASSCODE:guest}
      system-login: ${BOKATI_STOMP_SYSTEM_LOGIN:guest}
      system-passcode: ${BOKATI_STOMP_SYSTEM_PASSCODE:guest}
  email:
    # Deduplication window per outbound mail. Mail carrying a business reference (invoice,
    # contract, KYC case) is keyed on that reference; everything else falls back to
    # recipient + subject, so its window stays short.
    dedup:
      enabled: ${EMAIL_DEDUP_ENABLED:true}
      business-window-seconds: ${EMAIL_DEDUP_BUSINESS_WINDOW_SECONDS:86400}
      generic-window-seconds: ${EMAIL_DEDUP_GENERIC_WINDOW_SECONDS:3600}
  graph-api:
    rate-limit:
      # Exchange Online caps a mailbox at roughly 30 messages/minute; this limiter is also
      # per-instance, so the effective ceiling is this value times the number of dynos.
      limit-for-period: ${GRAPH_RATE_LIMIT:25}
      limit-refresh-period-ms: ${GRAPH_RATE_LIMIT_REFRESH_MS:60000}
      timeout-ms: ${GRAPH_RATE_LIMIT_TIMEOUT_MS:30000}
  billing:
    workers:
      fiscal-integrity-cron:  ${BILLING_FISCAL_INTEGRITY_CRON:0 0 2 * * *}
      daily-closure-cron:     ${BILLING_DAILY_CLOSURE_CRON:0 30 23 * * *}
      monthly-closure-cron:   ${BILLING_MONTHLY_CLOSURE_CRON:0 15 0 1 * *}
      annual-closure-cron:    ${BILLING_ANNUAL_CLOSURE_CRON:0 0 1 1 1 *}
  checkin:
    scanner-key: ${CHECKIN_SCANNER_KEY:}
    early-window-minutes: ${CHECKIN_EARLY_WINDOW_MINUTES:15}
    location:
      latitude: ${CHECKIN_LOCATION_LAT:0}
      longitude: ${CHECKIN_LOCATION_LNG:0}
      radius-meters: ${CHECKIN_LOCATION_RADIUS:200}
  task:
    reminder-cron: ${TASK_REMINDER_CRON:0 0 * * * *}
    due-soon-hours: ${TASK_DUE_SOON_HOURS:24}
    booking-prep-hours: ${TASK_BOOKING_PREP_HOURS:2}
    booking-default-assignee: ${TASK_BOOKING_DEFAULT_ASSIGNEE:}
    booking-cleanup-default-assignee: ${TASK_BOOKING_CLEANUP_DEFAULT_ASSIGNEE:}
    inventory-reorder-due-hours: ${TASK_INVENTORY_REORDER_DUE_HOURS:24}
    inventory-default-assignee: ${TASK_INVENTORY_DEFAULT_ASSIGNEE:}
