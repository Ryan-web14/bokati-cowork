#Behind the TLS-terminating proxy, honour X-Forwarded-* so request.isSecure(),
# the request scheme and generated redirects reflect the original HTTPS request.
server:
  forward-headers-strategy: framework

spring:
  application:
    name: bokati-cowork

  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BokatiHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      connection-test-query: SELECT 1

  jpa:
    database: postgresql
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration-prod
    default-schema: public
    schemas: public
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false

  rabbitmq:
    addresses: ${CLOUDAMQP_URL}

  jte:
    development-mode: false

  mail:
    microsoft:
      graph:
        client-id: ${MICROSOFT_GRAPH_CLIENT_ID}
        client-secret: ${MICROSOFT_GRAPH_CLIENT_SECRET}
        tenant-id: ${MICROSOFT_GRAPH_TENANT_ID}
        sender-email: ${MICROSOFT_SENDER_EMAIL:no-reply@elleaose.com}

logging:
  level:
    root: WARN
    com.sni.bokaticowork: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.flywaydb: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

  datadog:
    metrics:
      export:
        enabled: ${DATADOG_METRICS_ENABLED:false}

  defaults:
    metrics:
      export:
        enabled: false

bokati:
  websocket:
    use-stomp-relay: ${BOKATI_WEBSOCKET_USE_STOMP_RELAY:true}
    stomp:
      # Derive relay host / credentials / vhost / TLS from the same URL used for AMQP.
      # The Heroku CloudAMQP add-on only provides CLOUDAMQP_URL, so this is the single
      # source of truth and avoids the vhost defaulting to "/" (wrong on shared plans).
      broker-url: ${CLOUDAMQP_URL:}
      relay-port: ${CLOUDAMQP_STOMP_PORT:61614}
      # Optional explicit overrides · only used when broker-url is empty.
      use-tls: ${BOKATI_WEBSOCKET_STOMP_USE_TLS:true}
      relay-host: ${CLOUDAMQP_STOMP_HOST:localhost}
      virtual-host: ${CLOUDAMQP_VHOST:/}
      client-login: ${CLOUDAMQP_STOMP_USER:guest}
      client-passcode: ${CLOUDAMQP_STOMP_PASS:guest}
      system-login: ${CLOUDAMQP_STOMP_USER:guest}
      system-passcode: ${CLOUDAMQP_STOMP_PASS:guest}
  support:
    sender-email: ${SUPPORT_SENDER_EMAIL:supportela@elleaose.com}
    manager-email: ${SUPPORT_MANAGER_EMAIL:supportela@elleaose.com}
    inbound-poll-delay-ms: ${SUPPORT_INBOUND_POLL_DELAY_MS:60000}
    csat-check-delay-ms: ${SUPPORT_CSAT_CHECK_DELAY_MS:3600000}
    sla-check-delay-ms: ${SUPPORT_SLA_CHECK_DELAY_MS:3600000}
    auto-close-delay-days: ${SUPPORT_AUTO_CLOSE_DELAY_DAYS:5}
    auto-close-check-delay-ms: ${SUPPORT_AUTO_CLOSE_CHECK_DELAY_MS:3600000}

  payment:
    cash-session:
      auto-limit: ${CASH_SESSION_AUTO_LIMIT:10000000}

  # Destinataires internes des courriels d'alerte · a defaut, le manager support
  billing:
    dunning:
      # Qui reprend un impaye a la main quand les relances automatiques sont epuisees · une ou plusieurs adresses, separees par des virgules
      handover-email: ${DUNNING_HANDOVER_EMAIL:${SUPPORT_MANAGER_EMAIL:supportela@elleaose.com}}
  wallet:
    treasury:
      # Qui est prevenu quand la tresorerie ne couvre plus l'encours des portefeuilles · une ou plusieurs adresses, separees par des virgules
      alert-email: ${WALLET_TREASURY_ALERT_EMAIL:${SUPPORT_MANAGER_EMAIL:supportela@elleaose.com}}
  domiciliation:
    # L'administration fiscale · adresse externe, sans repli : vide tant qu'elle n'est pas confirmee
    administration-email: ${DOMICILIATION_ADMINISTRATION_EMAIL:}
    notify-administration-on-termination: ${DOMICILIATION_NOTIFY_ADMINISTRATION:false}

    cash-declaration:
      # Combien de temps une annonce de paiement en especes tient · au-dela, la reservation
      # est rendue et la facture redevient simplement due.
      validity-hours: ${CASH_DECLARATION_VALIDITY_HOURS:4}
      # Le worker passe plus souvent que le delai n est court · sinon un creneau tenu
      # 4 h serait rendu avec une heure de retard.
      expiry-delay-ms: ${CASH_DECLARATION_EXPIRY_DELAY_MS:900000}
      # Qui tient la caisse · une ou plusieurs adresses, separees par des virgules.
      # La chaine de repli vit ici et non dans le code : une propriete definie mais vide
      # n est pas une propriete absente, et le defaut du @Value ne se declenchait jamais.
      desk-email: ${CASH_DECLARATION_DESK_EMAIL:${SELF_SERVICE_CONFIRMATION_EMAIL:${SUPPORT_MANAGER_EMAIL:supportela@elleaose.com}}}
    self-service:
      # Qui est prevenu qu un client a regle depuis son espace · une ou plusieurs adresses,
      # separees par des virgules. Vide : seule la notification dans le portail part.
      confirmation-email: ${SELF_SERVICE_CONFIRMATION_EMAIL:${SUPPORT_MANAGER_EMAIL:supportela@elleaose.com}}
    pawaypay:
      enabled: ${PAWAYPAY_ENABLED:true}
      api-key: ${PAWAYPAY_API_KEY}
      base-url: ${PAWAYPAY_BASE_URL:https://api.pawapay.io}
      callback-base-url: ${APP_BASE_URL}
      # Sans secret, aucune signature n'est verifiable · chaque rappel est alors reconfirme
      # aupres de l'operateur avant la moindre ecriture.
      callback-secret: ${PAWAYPAY_CALLBACK_SECRET:}
      connect-timeout-ms: ${PAWAYPAY_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${PAWAYPAY_READ_TIMEOUT_MS:20000}
      # Le worker passe toutes les minutes · chaque depot porte sa propre echeance.
      polling-delay-ms: ${PAWAYPAY_POLLING_DELAY_MS:60000}
      # Au-dela, le depot est declare a rapprocher · jamais echoue.
      polling-max-hours: ${PAWAYPAY_POLLING_MAX_HOURS:24}
      in-flight-window-minutes: ${PAWAYPAY_IN_FLIGHT_WINDOW_MINUTES:20}
      # Qui rapproche les depots sans reponse · une ou plusieurs adresses separees par des virgules.
      alert-email: ${PAWAYPAY_ALERT_EMAIL:}
      # Plages de numeros par operateur · vide, aucun controle de prefixe (une plage fausse
      # refuserait un paiement valable). Exemple : MTN_MOMO_COG=06,05;AIRTEL_COG=04,05
      operator-prefixes: ${PAWAYPAY_OPERATOR_PREFIXES:}
      # L'essai depense de l'argent reel · ferme en production.
      test-endpoint-enabled: ${PAWAYPAY_TEST_ENDPOINT_ENABLED:false}
      payment-page-country: ${PAWAYPAY_PAYMENT_PAGE_COUNTRY:COG}
      payment-page-language: ${PAWAYPAY_PAYMENT_PAGE_LANGUAGE:fr}
      payment-page-result-url: ${PAWAYPAY_PAYMENT_PAGE_RESULT_URL:https://app.elleaose.com/payment/result}

app:
  dev-mode: false

  api-base-url: ${APP_BASE_URL}
  admin-access-url: ${ADMIN_ACCESS_URL:https://admin.elleaose.com}
  verify-base-url: ${APP_BASE_URL}

  document:
    storage:
      provider: ${DOCUMENT_STORAGE_PROVIDER:s3}
      root-path: ${DOCUMENT_STORAGE_ROOT_PATH:storage/documents}
      minio:
        endpoint: ${MINIO_ENDPOINT:${BUCKETEER_ENDPOINT_URL:${BUCKETEER_ENDPOINT:https://s3.amazonaws.com}}}
        bucket: ${MINIO_BUCKET:${BUCKETEER_BUCKET_NAME:${S3_BUCKET_NAME:}}}
        access-key: ${MINIO_ACCESS_KEY:${BUCKETEER_AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID:}}}
        secret-key: ${MINIO_SECRET_KEY:${BUCKETEER_AWS_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY:}}}
        region: ${MINIO_REGION:${BUCKETEER_AWS_REGION:${AWS_REGION:us-west-1}}}

    worker:
      enabled: ${DOCUMENT_WORKER_ENABLED:true}
      fixed-delay-ms: ${DOCUMENT_WORKER_FIXED_DELAY_MS:3600000}

  contract:
    worker:
      enabled: ${CONTRACT_WORKER_ENABLED:true}
      fixed-delay-ms: ${CONTRACT_WORKER_FIXED_DELAY_MS:3600000}

  outbox:
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS:500}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:100}

  kyc:
    ocr:
      enabled: ${KYC_OCR_ENABLED:false}
      provider: ${KYC_OCR_PROVIDER:TESSERACT}
      language: ${KYC_OCR_LANGUAGE:fra+eng}
      data-path: ${KYC_OCR_DATA_PATH:storage/tessdata}

  security:
    auto-admin:
      enabled: ${AUTO_ADMIN_SECURITY_CONTEXT_ENABLED:false}
      email: ${AUTO_ADMIN_EMAIL:admin@bokati.com}

    failed-login:
      max-attempts: ${FAILED_LOGIN_MAX_ATTEMPTS:5}

    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}

      login:
        max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}

      otp:
        max-requests: ${RATE_LIMIT_OTP_MAX_REQUESTS:3}
        window-seconds: ${RATE_LIMIT_OTP_WINDOW_SECONDS:600}

      callback:
        max-requests: ${RATE_LIMIT_CALLBACK_MAX_REQUESTS:120}
        window-seconds: ${RATE_LIMIT_CALLBACK_WINDOW_SECONDS:60}

      admin:
        max-requests: ${RATE_LIMIT_ADMIN_MAX_REQUESTS:600}
        window-seconds: ${RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}

    jwt:
      secret: ${APP_JWT_SECRET}
      access-token-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
      verification-token-expiration-ms: ${APP_JWT_VERIFICATION_EXPIRATION_MS:900000}

    one-time-token:
      expiration-ms: ${APP_OTT_EXPIRATION_MS:900000}

    password-reset:
      expiration-ms: ${APP_PASSWORD_RESET_EXPIRATION_MS:900000}

    token-hash:
      secret: ${TOKEN_HASH_SECRET}
